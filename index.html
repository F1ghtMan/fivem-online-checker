<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Server Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            text-align: center;
            color: #38bdf8;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            min-height: 120px;
            border: 1px solid #334155;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .value {
            font-weight: 600;
            text-align: right;
        }
        .value.online {
            color: #4ade80;
        }
        .value.offline {
            color: #f87171;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }
        .error {
            color: #f87171;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🟢 FiveM Server Online</h1>
        <div class="input-group">
            <input type="text" id="serverId" placeholder="ID сервера (например, 6r9ob4)" maxlength="10">
            <button id="checkBtn">Проверить</button>
        </div>
        <div id="result" class="result">
            <div class="loading">Введите ID сервера и нажмите «Проверить».</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('serverId');
        const button = document.getElementById('checkBtn');
        const result = document.getElementById('result');

        async function fetchServerData(serverId) {
            // Официальный публичный API FiveM (фронтенд-сервер)
            const originalUrl = `https://servers-frontend.fivem.net/api/servers/single/${encodeURIComponent(serverId)}`;
            // Оборачиваем его в прокси corsproxy.io
            const url = `https://corsproxy.io/?key=af725d65&url=${encodeURIComponent(originalUrl)}`;

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Ошибка HTTP: ${response.status}`);
            }
            const data = await response.json();

            // Структура ответа может немного отличаться, но обычно данные лежат в поле Data
            const server = data.Data || data;

            // Извлекаем ключевые поля
            const online = server.online ?? true; // Если сервер найден, считаем онлайн
            const players = server.players || [];
            const playerCount = players.length;
            const maxPlayers = server.sv_maxclients ?? server.slots ?? '?';
            const hostname = server.hostname || 'Неизвестно';

            return {
                online,
                hostname,
                playerCount,
                maxPlayers,
                players
            };
        }

        function renderResult(data) {
            if (!data) {
                result.innerHTML = '<div class="error">Не удалось получить данные.</div>';
                return;
            }

            const statusClass = data.online ? 'online' : 'offline';
            const statusText = data.online ? '🟢 Онлайн' : '🔴 Офлайн';

            let html = `
                <div class="result-row">
                    <span class="label">Статус</span>
                    <span class="value ${statusClass}">${statusText}</span>
                </div>
                <div class="result-row">
                    <span class="label">Название</span>
                    <span class="value">${escapeHtml(data.hostname)}</span>
                </div>
                <div class="result-row">
                    <span class="label">Игроков онлайн</span>
                    <span class="value">${data.playerCount} / ${data.maxPlayers}</span>
                </div>
            `;

            // Если есть список игроков, покажем первых 5
            if (data.players && data.players.length > 0) {
                html += `<div class="result-row"><span class="label">Игроки (первые 5)</span><span class="value"></span></div>`;
                data.players.slice(0, 5).forEach(p => {
                    html += `
                        <div class="result-row">
                            <span class="label" style="padding-left: 15px;">${escapeHtml(p.name || 'Без имени')}</span>
                            <span class="value">${p.ping || 0} ms</span>
                        </div>
                    `;
                });
                if (data.players.length > 5) {
                    html += `<div class="result-row"><span class="label" style="padding-left: 15px;">… и ещё ${data.players.length - 5}</span><span class="value"></span></div>`;
                }
            }

            result.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function checkServer() {
            const serverId = input.value.trim();
            if (!serverId) {
                result.innerHTML = '<div class="error">Пожалуйста, введите ID сервера.</div>';
                return;
            }

            button.disabled = true;
            result.innerHTML = '<div class="loading">⏳ Загрузка данных…</div>';

            try {
                const data = await fetchServerData(serverId);
                renderResult(data);
            } catch (err) {
                console.error(err);
                result.innerHTML = `<div class="error">❌ Не удалось получить данные: ${escapeHtml(err.message)}<br><small>Проверьте ID сервера и подключение к интернету.</small></div>`;
            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener('click', checkServer);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkServer();
        });
    </script>
</body>
</html>
